<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时物体检测系统</title>
  <!-- 引入外部资源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <!-- 引入TensorFlow.js和目标检测模型 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.14.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  
  <!-- 配置Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            secondary: '#36D399',
            warning: '#FBBD23',
            danger: '#F87272',
            dark: '#1E293B',
            light: '#F8FAFC'
          }
        }
      }
    }
  </script>
  
  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .detection-box {
        @apply border-2 absolute transition-all duration-300;
      }
      .pulse-slow {
        animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    }
  </style>
  
  <style>
    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.7;
      }
    }
    
    /* 检测框动画 */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .detection-box, .label-box {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>

<body class="bg-gray-50 min-h-screen p-4 md:p-6">
  <div class="container mx-auto max-w-7xl">
    <header class="text-center mb-6 md:mb-8">
      <h1 class="text-[clamp(1.5rem,5vw,2.5rem)] font-bold text-dark flex items-center justify-center">
        <i class="fa fa-eye text-primary mr-3"></i>实时物体检测系统
      </h1>
      <p class="text-gray-600 mt-2 max-w-2xl mx-auto">
        调用摄像头实时识别画面中的物体，并显示物体名称和置信度
      </p>
    </header>
    
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- 左侧：摄像头和检测区域 -->
      <div class="lg:col-span-2">
        <div class="bg-white rounded-xl shadow-lg p-4 md:p-6">
          <h2 class="text-xl font-semibold text-dark mb-4 flex items-center">
            <i class="fa fa-video-camera text-primary mr-2"></i>摄像头画面
          </h2>
          
          <!-- 视频和画布容器 -->
          <div class="relative w-full" style="padding-top: 56.25%;"> <!-- 16:9比例 -->
            <div class="absolute inset-0 bg-gray-900 rounded-lg overflow-hidden">
              <video id="video" class="w-full h-full object-cover" autoplay muted playsinline></video>
              <canvas id="canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
              
              <!-- 加载状态 -->
              <div id="loading-overlay" class="absolute inset-0 bg-dark/70 flex flex-col items-center justify-center">
                <div class="w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-white text-lg">加载模型中...</p>
              </div>
              
              <!-- 未启动状态 -->
              <div id="not-started" class="absolute inset-0 bg-dark/70 flex flex-col items-center justify-center">
                <i class="fa fa-camera text-5xl text-primary mb-4 opacity-70"></i>
                <p class="text-white text-center max-w-md">请点击下方按钮启动摄像头，开始物体检测</p>
              </div>
            </div>
          </div>
          
          <!-- 控制按钮 -->
          <div class="mt-5 flex flex-wrap gap-3">
            <button id="start-btn" class="bg-primary hover:bg-primary/90 text-white px-5 py-2.5 rounded-lg flex items-center transition-all shadow-md hover:shadow-lg">
              <i class="fa fa-play mr-2"></i>启动摄像头
            </button>
            <button id="stop-btn" class="bg-gray-500 hover:bg-gray-600 text-white px-5 py-2.5 rounded-lg flex items-center transition-all shadow-md hover:shadow-lg" disabled>
              <i class="fa fa-stop mr-2"></i>停止检测
            </button>
            <button id="refresh-btn" class="bg-warning hover:bg-warning/90 text-white px-5 py-2.5 rounded-lg flex items-center transition-all shadow-md hover:shadow-lg">
              <i class="fa fa-refresh mr-2"></i>刷新模型
            </button>
            <button id="toggle-labels" class="bg-gray-200 hover:bg-gray-300 text-dark px-5 py-2.5 rounded-lg flex items-center transition-all shadow-md hover:shadow-lg">
              <i class="fa fa-tag mr-2"></i>显示标签
            </button>
          </div>
        </div>
      </div>
      
      <!-- 右侧：检测结果面板 -->
      <div>
        <div class="bg-white rounded-xl shadow-lg p-4 md:p-6 h-full">
          <h2 class="text-xl font-semibold text-dark mb-5 flex items-center">
            <i class="fa fa-list-alt text-primary mr-2"></i>检测结果
          </h2>
          
          <!-- 检测统计 -->
          <div class="mb-6">
            <div class="bg-gray-50 rounded-lg p-4">
              <p class="text-gray-600 mb-1">当前检测到的物体数量</p>
              <div id="object-count" class="text-3xl font-bold text-primary">0</div>
            </div>
          </div>
          
          <!-- 状态信息 -->
          <div class="space-y-3 mb-6">
            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
              <span class="text-gray-600">模型状态</span>
              <span id="model-status" class="text-gray-500">未加载</span>
            </div>
            
            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
              <span class="text-gray-600">摄像头状态</span>
              <span id="camera-status" class="text-gray-500">未启动</span>
            </div>
            
            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
              <span class="text-gray-600">检测频率</span>
              <span class="text-gray-800">2次/秒</span>
            </div>
            
            <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
              <span class="text-gray-600">最后更新时间</span>
              <span id="last-update" class="text-gray-500">-</span>
            </div>
          </div>
          
          <!-- 物体列表 -->
          <div>
            <h3 class="text-lg font-medium text-dark mb-3 flex items-center">
              <i class="fa fa-cubes text-primary mr-2"></i>识别到的物体
            </h3>
            <div id="objects-list" class="max-h-[300px] overflow-y-auto text-sm space-y-2 p-3 bg-gray-50 rounded-lg">
              <p class="text-gray-500 italic text-center py-6">等待检测开始...</p>
            </div>
          </div>
        </div>
      </div>
    </main>
    
    <footer class="mt-8 text-center text-gray-500 text-sm">
      <p>使用 TensorFlow.js COCO-SSD 模型进行实时物体检测 | 支持80多种常见物体识别</p>
    </footer>
  </div>

  <script>
    // 全局状态
    const state = {
      model: null,
      stream: null,
      detectionInterval: null,
      isRunning: false,
      showLabels: true, // 是否显示标签
      detectedObjects: [] // 存储检测到的物体
    };
    
    // DOM元素
    const elements = {
      video: document.getElementById('video'),
      canvas: document.getElementById('canvas'),
      objectCount: document.getElementById('object-count'),
      startBtn: document.getElementById('start-btn'),
      stopBtn: document.getElementById('stop-btn'),
      refreshBtn: document.getElementById('refresh-btn'),
      toggleLabels: document.getElementById('toggle-labels'),
      modelStatus: document.getElementById('model-status'),
      cameraStatus: document.getElementById('camera-status'),
      lastUpdate: document.getElementById('last-update'),
      objectsList: document.getElementById('objects-list'),
      loadingOverlay: document.getElementById('loading-overlay'),
      notStarted: document.getElementById('not-started')
    };
    
    // 初始化画布上下文
    const ctx = elements.canvas.getContext('2d');
    
    // 颜色映射 - 为不同类型的物体分配不同颜色
    const colorMap = {
      'person': '#165DFF',
      'bicycle': '#36D399',
      'car': '#FBBD23',
      'motorcycle': '#F87272',
      'airplane': '#93C5FD',
      'bus': '#A7F3D0',
      'train': '#FDE68A',
      'truck': '#FECACA',
      'boat': '#60A5FA',
      'traffic light': '#4ADE80',
      'fire hydrant': '#FBBF24',
      'stop sign': '#EF4444',
      'parking meter': '#818CF8',
      'bench': '#A7F3D0',
      'bird': '#FDE68A',
      'cat': '#FECACA',
      'dog': '#60A5FA',
      'horse': '#4ADE80',
      'sheep': '#FBBF24',
      'cow': '#EF4444',
      'elephant': '#818CF8',
      'bear': '#A7F3D0',
      'zebra': '#FDE68A',
      'giraffe': '#FECACA',
      'backpack': '#60A5FA',
      'umbrella': '#4ADE80',
      'handbag': '#FBBF24',
      'tie': '#EF4444',
      'suitcase': '#818CF8',
      'frisbee': '#A7F3D0',
      'skis': '#FDE68A',
      'snowboard': '#FECACA',
      'sports ball': '#60A5FA',
      'kite': '#4ADE80',
      'baseball bat': '#FBBF24',
      'baseball glove': '#EF4444',
      'skateboard': '#818CF8',
      'surfboard': '#A7F3D0',
      'tennis racket': '#FDE68A',
      'bottle': '#FECACA',
      'wine glass': '#60A5FA',
      'cup': '#4ADE80',
      'fork': '#FBBF24',
      'knife': '#EF4444',
      'spoon': '#818CF8',
      'bowl': '#A7F3D0',
      'banana': '#FDE68A',
      'apple': '#FECACA',
      'sandwich': '#60A5FA',
      'orange': '#4ADE80',
      'broccoli': '#FBBF24',
      'carrot': '#EF4444',
      'hot dog': '#818CF8',
      'pizza': '#A7F3D0',
      'donut': '#FDE68A',
      'cake': '#FECACA',
      'chair': '#60A5FA',
      'couch': '#4ADE80',
      'potted plant': '#FBBF24',
      'bed': '#EF4444',
      'dining table': '#818CF8',
      'toilet': '#A7F3D0',
      'tv': '#FDE68A',
      'laptop': '#FECACA',
      'mouse': '#60A5FA',
      'remote': '#4ADE80',
      'keyboard': '#FBBF24',
      'cell phone': '#EF4444',
      'microwave': '#818CF8',
      'oven': '#A7F3D0',
      'toaster': '#FDE68A',
      'sink': '#FECACA',
      'refrigerator': '#60A5FA',
      'book': '#4ADE80',
      'clock': '#FBBF24',
      'vase': '#EF4444',
      'scissors': '#818CF8',
      'teddy bear': '#A7F3D0',
      'hair drier': '#FDE68A',
      'toothbrush': '#FECACA'
    };
    
    // 获取物体对应的颜色
    function getColorForClass(className) {
      return colorMap[className] || '#9CA3AF'; // 默认灰色
    }
    
    // 格式化时间
    function formatTime() {
      const now = new Date();
      return now.toLocaleTimeString();
    }
    
    // 更新物体列表显示
    function updateObjectsList(objects) {
      // 清空列表
      elements.objectsList.innerHTML = '';
      
      if (objects.length === 0) {
        elements.objectsList.innerHTML = '<p class="text-gray-500 italic text-center py-6">未检测到物体</p>';
        return;
      }
      
      // 按置信度排序
      const sortedObjects = [...objects].sort((a, b) => b.score - a.score);
      
      // 添加物体到列表
      sortedObjects.forEach(obj => {
        const color = getColorForClass(obj.class);
        const item = document.createElement('div');
        item.className = 'p-2 border-l-4 rounded bg-gray-100 hover:bg-gray-200 transition-colors';
        item.style.borderLeftColor = color;
        
        // 转换为中文名称（常见物体）
        const chineseNames = {
          'person': '人',
          'bicycle': '自行车',
          'car': '汽车',
          'motorcycle': '摩托车',
          'airplane': '飞机',
          'bus': '公交车',
          'train': '火车',
          'truck': '卡车',
          'boat': '船',
          'traffic light': '交通灯',
          'stop sign': '停止标志',
          'bench': '长椅',
          'bird': '鸟',
          'cat': '猫',
          'dog': '狗',
          'backpack': '背包',
          'umbrella': '雨伞',
          'handbag': '手提包',
          'suitcase': '行李箱',
          'bottle': '瓶子',
          'cup': '杯子',
          'fork': '叉子',
          'knife': '刀',
          'spoon': '勺子',
          'banana': '香蕉',
          'apple': '苹果',
          'chair': '椅子',
          'couch': '沙发',
          'potted plant': '盆栽',
          'tv': '电视',
          'laptop': '笔记本电脑',
          'mouse': '鼠标',
          'keyboard': '键盘',
          'cell phone': '手机',
          'book': '书',
          'clock': '时钟'
        };
        
        const objectName = chineseNames[obj.class] || obj.class;
        
        item.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <p class="font-medium">${objectName}</p>
              <p class="text-xs text-gray-500 mt-0.5">${obj.class}</p>
            </div>
            <span class="px-2 py-0.5 rounded text-xs font-medium" style="background-color: ${color}30; color: ${color}">
              ${Math.round(obj.score * 100)}%
            </span>
          </div>
        `;
        
        elements.objectsList.appendChild(item);
      });
    }
    
    // 绘制检测结果
    function drawDetections(predictions) {
      // 清除画布
      ctx.clearRect(0, 0, elements.canvas.width, elements.canvas.height);
      
      // 调整画布尺寸与视频一致
      elements.canvas.width = elements.video.videoWidth;
      elements.canvas.height = elements.video.videoHeight;
      
      // 过滤低置信度的结果
      const filteredPredictions = predictions.filter(pred => pred.score > 0.5);
      
      // 更新检测到的物体数量
      elements.objectCount.textContent = filteredPredictions.length;
      state.detectedObjects = filteredPredictions;
      
      // 更新物体列表
      updateObjectsList(filteredPredictions);
      
      // 更新最后更新时间
      elements.lastUpdate.textContent = formatTime();
      
      // 如果不显示标签，直接返回
      if (!state.showLabels) return;
      
      // 绘制检测框和标签
      filteredPredictions.forEach(prediction => {
        const { x, y, width, height } = prediction.bbox;
        const color = getColorForClass(prediction.class);
        
        // 绘制边框
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, width, height);
        
        // 添加阴影效果
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.shadowBlur = 0;
        
        // 转换为中文名称
        const chineseNames = {
          'person': '人',
          'bicycle': '自行车',
          'car': '汽车',
          'motorcycle': '摩托车',
          'bus': '公交车',
          'train': '火车',
          'truck': '卡车',
          'bird': '鸟',
          'cat': '猫',
          'dog': '狗',
          'backpack': '背包',
          'umbrella': '雨伞',
          'bottle': '瓶子',
          'cup': '杯子',
          'chair': '椅子',
          'couch': '沙发',
          'tv': '电视',
          'laptop': '笔记本电脑',
          'cell phone': '手机',
          'book': '书'
        };
        
        const objectName = chineseNames[prediction.class] || prediction.class;
        
        // 绘制标签背景
        const label = `${objectName} (${Math.round(prediction.score * 100)}%)`;
        ctx.font = '14px Arial';
        const textMetrics = ctx.measureText(label);
        const textWidth = textMetrics.width + 10;
        const textHeight = 22;
        
        // 确保标签在视频范围内
        const labelX = x > elements.canvas.width - textWidth ? elements.canvas.width - textWidth : x;
        const labelY = y < textHeight ? y + height + textHeight : y;
        
        ctx.fillStyle = color;
        ctx.fillRect(labelX, labelY - textHeight, textWidth, textHeight);
        
        // 绘制标签文本
        ctx.fillStyle = 'white';
        ctx.fillText(label, labelX + 5, labelY - 5);
      });
    }
    
    // 加载模型
    async function loadModel() {
      try {
        elements.modelStatus.textContent = '加载中...';
        elements.modelStatus.className = 'text-warning';
        
        // 加载COCO-SSD模型，支持80多种物体检测
        state.model = await cocoSsd.load();
        
        elements.modelStatus.textContent = '已加载';
        elements.modelStatus.className = 'text-secondary';
        return true;
      } catch (error) {
        console.error('模型加载失败:', error);
        elements.modelStatus.textContent = '加载失败';
        elements.modelStatus.className = 'text-danger';
        
        // 显示错误信息
        const errorItem = document.createElement('div');
        errorItem.className = 'text-danger p-3 bg-red-50 rounded-lg mb-3';
        errorItem.innerHTML = '<i class="fa fa-exclamation-circle mr-2"></i>模型加载失败，请点击刷新按钮重试';
        elements.objectsList.innerHTML = '';
        elements.objectsList.appendChild(errorItem);
        
        return false;
      }
    }
    
    // 开始检测
    async function startDetection() {
      // 确保模型已加载
      if (!state.model) {
        const loaded = await loadModel();
        if (!loaded) return;
      }
      
      try {
        // 隐藏初始状态提示
        elements.notStarted.classList.add('hidden');
        elements.loadingOverlay.classList.add('hidden');
        
        // 获取摄像头流
        if (!state.stream) {
          state.stream = await navigator.mediaDevices.getUserMedia({
            video: { 
              width: { ideal: 1280 },
              height: { ideal: 720 },
              facingMode: 'environment' // 优先使用后置摄像头
            }
          });
          
          elements.video.srcObject = state.stream;
          elements.cameraStatus.textContent = '运行中';
          elements.cameraStatus.className = 'text-secondary';
        }
        
        // 设置按钮状态
        state.isRunning = true;
        elements.startBtn.disabled = true;
        elements.stopBtn.disabled = false;
        elements.startBtn.classList.add('bg-gray-500');
        elements.startBtn.classList.remove('bg-primary', 'hover:bg-primary/90');
        
        // 开始检测循环（每500ms一次）
        if (state.detectionInterval) {
          clearInterval(state.detectionInterval);
        }
        
        // 首次立即检测
        detectFrame();
        
        // 设置定时检测
        state.detectionInterval = setInterval(detectFrame, 500);
      } catch (error) {
        console.error('启动检测失败:', error);
        elements.cameraStatus.textContent = '启动失败';
        elements.cameraStatus.className = 'text-danger';
        
        // 显示错误信息
        const errorItem = document.createElement('div');
        errorItem.className = 'text-danger p-3 bg-red-50 rounded-lg mb-3';
        
        if (error.name === 'NotAllowedError') {
          errorItem.innerHTML = '<i class="fa fa-exclamation-circle mr-2"></i>需要摄像头权限，请在浏览器设置中允许';
        } else if (error.name === 'NotFoundError') {
          errorItem.innerHTML = '<i class="fa fa-exclamation-circle mr-2"></i>未检测到摄像头设备';
        } else if (error.name === 'NotReadableError') {
          errorItem.innerHTML = '<i class="fa fa-exclamation-circle mr-2"></i>摄像头被占用，无法访问';
        } else {
          errorItem.innerHTML = `<i class="fa fa-exclamation-circle mr-2"></i>摄像头启动失败: ${error.message}`;
        }
        
        elements.objectsList.innerHTML = '';
        elements.objectsList.appendChild(errorItem);
      }
    }
    
    // 单帧检测
    async function detectFrame() {
      if (!state.model || !state.isRunning || elements.video.readyState !== 4) {
        return;
      }
      
      try {
        const predictions = await state.model.detect(elements.video);
        drawDetections(predictions);
      } catch (error) {
        console.error('检测过程出错:', error);
        
        // 只在运行状态下显示错误
        if (state.isRunning) {
          const errorItem = document.createElement('div');
          errorItem.className = 'text-warning p-3 bg-yellow-50 rounded-lg mb-3';
          errorItem.innerHTML = '<i class="fa fa-exclamation-triangle mr-2"></i>检测过程出错，正在重试...';
          
          // 保留现有内容，只在顶部添加错误提示
          const currentContent = elements.objectsList.innerHTML;
          elements.objectsList.innerHTML = '';
          elements.objectsList.appendChild(errorItem);
          elements.objectsList.innerHTML += currentContent;
        }
      }
    }
    
    // 停止检测
    function stopDetection() {
      state.isRunning = false;
      
      // 清除检测循环
      if (state.detectionInterval) {
        clearInterval(state.detectionInterval);
        state.detectionInterval = null;
      }
      
      // 停止视频流
      if (state.stream) {
        state.stream.getTracks().forEach(track => track.stop());
        state.stream = null;
      }
      
      // 重置画布
      ctx.clearRect(0, 0, elements.canvas.width, elements.canvas.height);
      
      // 更新状态
      elements.cameraStatus.textContent = '已停止';
      elements.cameraStatus.className = 'text-gray-500';
      elements.startBtn.disabled = false;
      elements.stopBtn.disabled = true;
      elements.startBtn.classList.remove('bg-gray-500');
      elements.startBtn.classList.add('bg-primary', 'hover:bg-primary/90');
      elements.notStarted.classList.remove('hidden');
      elements.objectCount.textContent = '0';
      elements.objectsList.innerHTML = '<p class="text-gray-500 italic text-center py-6">检测已停止</p>';
    }
    
    // 刷新模型
    async function refreshModel() {
      // 显示加载状态
      elements.loadingOverlay.classList.remove('hidden');
      elements.objectsList.innerHTML = '<p class="text-gray-500 italic text-center py-6">正在刷新模型...</p>';
      
      // 先停止检测
      if (state.isRunning) {
        stopDetection();
      }
      
      // 重新加载模型
      await loadModel();
      elements.loadingOverlay.classList.add('hidden');
    }
    
    // 切换标签显示
    function toggleLabels() {
      state.showLabels = !state.showLabels;
      
      if (state.showLabels) {
        elements.toggleLabels.innerHTML = '<i class="fa fa-tag mr-2"></i>显示标签';
        // 重新绘制以显示标签
        if (state.isRunning && state.detectedObjects.length > 0) {
          drawDetections(state.detectedObjects);
        }
      } else {
        elements.toggleLabels.innerHTML = '<i class="fa fa-tag mr-2"></i>隐藏标签';
        // 清除画布但不清除数据
        if (state.isRunning) {
          ctx.clearRect(0, 0, elements.canvas.width, elements.canvas.height);
        }
      }
    }
    
    // 事件监听
    elements.startBtn.addEventListener('click', startDetection);
    elements.stopBtn.addEventListener('click', stopDetection);
    elements.refreshBtn.addEventListener('click', refreshModel);
    elements.toggleLabels.addEventListener('click', toggleLabels);
    
    // 页面关闭时清理资源
    window.addEventListener('beforeunload', () => {
      if (state.stream) {
        state.stream.getTracks().forEach(track => track.stop());
      }
      if (state.detectionInterval) {
        clearInterval(state.detectionInterval);
      }
    });
    
    // 页面加载时尝试预加载模型
    window.addEventListener('load', () => {
      // 延迟加载模型，避免影响页面渲染
      setTimeout(() => {
        loadModel();
      }, 1000);
    });
  </script>
</body>
</html>
