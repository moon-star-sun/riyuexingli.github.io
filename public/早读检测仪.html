<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晨读音浪</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- 配置Tailwind自定义主题 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            chinese: {
              red: '#c8102e',      // 中国红
              gold: '#f8c300',     // 传统金
              jade: '#4a6f5d',     // 玉色
              paper: '#f5f1e6',    // 宣纸色
              ink: '#282425'       // 墨色
            }
          },
          fontFamily: {
            song: ['"Noto Serif SC"', 'serif'], // 宋体风格
            kai: ['"Noto Serif SC"', 'serif']   // 楷体风格
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .bg-school {
        background-image: url('https://picsum.photos/id/1067/1920/1080'); /* 中式校园背景图 */
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }
      .bg-overlay {
        background: linear-gradient(rgba(245, 241, 230, 0.85), rgba(245, 241, 230, 0.92));
      }
      .text-stroke {
        text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
      }
      /* 爱心形状样式 */
      .heart {
        position: absolute;
        transform: rotate(-45deg);
        transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        z-index: 5;
      }
      .heart::before, .heart::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
      }
      .title-decoration {
        position: relative;
      }
      .title-decoration::before,
      .title-decoration::after {
        content: "❦";
        color: #c8102e;
        opacity: 0.7;
        margin: 0 12px;
      }
      .pulse-gentle {
        animation: pulse-gentle 4s infinite;
      }
      @keyframes pulse-gentle {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
    }
  </style>
</head>
<body class="bg-school min-h-screen overflow-hidden flex flex-col items-center justify-between p-4 md:p-8">
  <!-- 背景遮罩（增强文字可读性） -->
  <div class="fixed inset-0 bg-overlay -z-10"></div>
  
  <!-- 顶部标题区 -->
  <header class="w-full text-center pt-6 md:pt-10 pb-4 relative">
    <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-40 h-1 bg-chinese-red/30 rounded-full"></div>
    <h1 class="text-[clamp(2.2rem,7vw,4.2rem)] font-kai font-bold text-chinese-ink text-stroke pulse-gentle">
      <span class="title-decoration">开始朗读，唤醒晨光</span>
    </h1>
    <div class="mt-2 text-chinese-jade text-lg italic font-song">—— 一日之计在于晨</div>
    <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-48 h-1 bg-chinese-jade/20 rounded-full"></div>
  </header>
  
  <!-- 中间分贝显示区 -->
  <main class="flex-grow flex flex-col items-center justify-center w-full relative">
    <!-- 中式窗格装饰 -->
    <div class="absolute w-80 h-80 md:w-96 md:h-96 rounded-full border-8 border-chinese-paper/50 
                bg-chinese-paper/10 backdrop-blur-sm -z-10"></div>
    
    <div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center">
      <div class="absolute inset-0 rounded-full border-4 border-chinese-red/20" id="outer-ring"></div>
      <div class="absolute inset-4 rounded-full border-2 border-chinese-gold/30" id="inner-ring"></div>
      
      <div class="text-center z-10">
        <p class="text-[clamp(3.2rem,10vw,5.8rem)] font-bold text-chinese-red transition-all duration-300" id="decibel-display">0</p>
        <p class="text-chinese-ink text-lg mt-2 tracking-wide font-song">分贝</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2 mt-8 text-chinese-ink text-center max-w-md px-4">
      <i class="fa fa-microphone text-chinese-red/70" id="mic-icon"></i>
      <p id="status-message" class="leading-relaxed font-song">
        请开启麦克风，让朗朗书声充满校园...
      </p>
    </div>
  </main>
  
  <!-- 底部爱心容器 -->
  <footer class="w-full h-2/5 md:h-1/2 relative mt-auto overflow-hidden">
    <!-- 底部渐变遮罩（模拟地面） -->
    <div class="absolute bottom-0 left-0 w-full h-1/3 bg-gradient-to-t from-chinese-jade/10 to-transparent z-10 pointer-events-none"></div>
    <div id="hearts-container" class="absolute bottom-0 left-0 w-full h-full"></div>
  </footer>

  <script>
    let audioContext;
    let analyser;
    let microphone;
    let decibelValue = 0;
    const hearts = []; // 存储爱心数据
    const HEARTS_COUNT = 50; // 确保50个爱心
    let animationId;
    let isActive = false;
    
    // DOM元素
    const decibelDisplay = document.getElementById('decibel-display');
    const statusMessage = document.getElementById('status-message');
    const heartsContainer = document.getElementById('hearts-container');
    const outerRing = document.getElementById('outer-ring');
    const innerRing = document.getElementById('inner-ring');
    const micIcon = document.getElementById('mic-icon');
    
    // 初始化音量检测
    async function initAudio() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);
        analyser.fftSize = 256;
        
        statusMessage.textContent = "书声已就绪，朗读吧，让知识随晨光绽放";
        micIcon.classList.add('animate-pulse');
        analyzeAudio();
      } catch (error) {
        console.error('音频初始化失败:', error);
        statusMessage.textContent = "请允许麦克风权限，开启晨读之旅";
        micIcon.classList.add('animate-pulse', 'text-chinese-red');
      }
    }
    
    // 分析音频
    function analyzeAudio() {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      
      function update() {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        let weight = 1;
        // 对人声敏感频段加权
        for (let i = 0; i < bufferLength; i++) {
          if (i > bufferLength * 0.5) weight = 1.8;
          sum += dataArray[i] * weight;
        }
        const average = sum / (bufferLength * 1.2);
        decibelValue = Math.min(Math.round(average * 0.7), 100);
        isActive = decibelValue > 8;
        
        // 更新分贝显示
        decibelDisplay.textContent = decibelValue;
        decibelDisplay.style.transform = `scale(${1 + decibelValue / 220})`;
        decibelDisplay.style.color = decibelValue > 60 ? '#c8102e' : decibelValue > 30 ? '#4a6f5d' : '#6b5b50';
        
        // 中式圆环动画
        const ringScale = 1 + decibelValue / 450;
        outerRing.style.transform = `scale(${ringScale})`;
        innerRing.style.transform = `scale(${1 + decibelValue / 700})`;
        outerRing.style.opacity = 0.2 + decibelValue / 200;
        innerRing.style.opacity = 0.3 + decibelValue / 300;
        
        // 更新爱心动画
        updateHearts();
        animationId = requestAnimationFrame(update);
      }
      update();
    }
    
    // 创建50个爱心
    function createHearts() {
      // 清空容器确保不会重复创建
      heartsContainer.innerHTML = '';
      hearts.length = 0;
      
      for (let i = 0; i < HEARTS_COUNT; i++) {
        const heart = document.createElement('div');
        const size = Math.random() * 30 + 15; // 爱心大小：15-45px
        const color = getChineseColor();
        
        heart.classList.add('heart');
        // 设置爱心尺寸
        heart.style.width = `${size}px`;
        heart.style.height = `${size}px`;
        heart.style.backgroundColor = color;
        
        // 计算爱心伪元素位置（确保形成完整爱心）
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.bottom = `${Math.random() * 60}px`;
        
        // 设置伪元素样式
        heart.style.setProperty('--before-top', `-${size / 2}px`);
        heart.style.setProperty('--before-left', '0');
        heart.style.setProperty('--after-top', '0');
        heart.style.setProperty('--after-left', `${size / 2}px`);
        
        // 存储爱心数据
        hearts.push({
          element: heart,
          size: size,
          x: Math.random() * 100, // 水平位置百分比
          y: Math.random() * 60,  // 垂直位置（从底部开始）
          velocityY: 0,           // 垂直速度
          velocityX: (Math.random() - 0.5) * 0.25, // 水平速度
          amplitude: Math.random() * 2.5 + 0.8,    // 摇摆幅度
          phase: Math.random() * Math.PI * 2,      // 摇摆相位
          damping: 0.965 + Math.random() * 0.025,  // 阻尼系数
          gravity: 0.055 + (size / 70) * 0.07,     // 重力（大小影响）
          buoyancy: 0.025 + Math.random() * 0.025  // 浮力
        });
        
        heartsContainer.appendChild(heart);
      }
      console.log(`已创建${hearts.length}个爱心`); // 调试日志确认数量
    }
    
    // 中式风格爱心颜色
    function getChineseColor() {
      const colors = [
        'rgba(200, 16, 46, ',    // 中国红
        'rgba(248, 195, 0, ',    // 传统金
        'rgba(74, 111, 93, ',    // 玉色
        'rgba(245, 241, 230, ',  // 宣纸色
        'rgba(139, 125, 96, '    // 木色
      ];
      const color = colors[Math.floor(Math.random() * colors.length)];
      return color + (0.4 + Math.random() * 0.3) + ')'; // 提高透明度确保可见
    }
    
    // 更新爱心动画
    function updateHearts() {
      const force = decibelValue / 3.8;
      
      hearts.forEach(heart => {
        // 声音驱动（书声越大，爱心升得越高）
        if (force > 1) {
          const pushForce = force * (0.5 + Math.random() * 0.7) * (45 / heart.size);
          heart.velocityY = -pushForce;
        }
        
        // 物理效果
        if (isActive) {
          // 有声音时：轻盈浮动
          heart.velocityY += (heart.gravity * 0.25) - heart.buoyancy;
        } else {
          // 无声时：缓慢下落
          heart.velocityY += heart.gravity - heart.buoyancy * 0.8;
        }
        
        // 应用阻尼
        heart.velocityY *= heart.damping;
        heart.velocityX *= 0.985;
        
        // 更新位置
        heart.y += heart.velocityY;
        heart.phase += 0.022;
        const sway = Math.sin(heart.phase) * heart.amplitude * (heart.velocityY * 0.2 + 0.4);
        heart.x += heart.velocityX + sway;
        
        // 边界控制
        if (heart.x < 0) heart.x = 0;
        if (heart.x > 100) heart.x = 100;
        
        const maxHeight = heartsContainer.clientHeight + heart.size;
        if (heart.y > maxHeight) {
          heart.y = -heart.size;
          heart.x = Math.random() * 100;
          heart.velocityY = 0;
        }
        
        if (heart.y < 0) {
          heart.y = 0;
          heart.velocityY *= -0.25;
        }
        
        // 应用位置和旋转（爱心需要旋转修正）
        heart.element.style.bottom = `${heart.y}px`;
        heart.element.style.left = `${heart.x}%`;
        // 随运动轻微调整旋转角度增加生动感
        const rotate = -45 + (sway * 5);
        heart.element.style.transform = `rotate(${rotate}deg)`;
      });
    }
    
    // 页面加载后初始化
    window.addEventListener('load', () => {
      createHearts(); // 优先创建爱心
      initAudio();
      
      // 窗口大小变化适配
      window.addEventListener('resize', () => {
        hearts.forEach(heart => {
          heart.element.style.left = `${heart.x}%`;
        });
      });
    });
    
    // 清理资源
    window.addEventListener('beforeunload', () => {
      if (animationId) cancelAnimationFrame(animationId);
      if (audioContext) audioContext.close();
    });
  </script>
</body>
</html>
