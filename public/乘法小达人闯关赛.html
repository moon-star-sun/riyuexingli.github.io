<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乘法小达人闯关赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', '微软雅黑', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #A8E6CF 0%, #98D8C8 25%, #B2E5D3 50%, #C8E6C9 75%, #D4F1E4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .game-container {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(232, 245, 233, 0.95));
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(168, 230, 207, 0.3), 0 5px 15px rgba(152, 216, 200, 0.2);
            overflow: hidden;
            position: relative;
            border: 3px solid #98D8C8;
        }
        
        .game-header {
            background: linear-gradient(90deg, #52C777 0%, #98D8C8 50%, #A8E6CF 100%);
            color: white;
            padding: 15px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 5px 15px rgba(82, 199, 119, 0.3);
        }
        
        .game-title {
            font-size: 28px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .game-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .game-content {
            padding: 20px;
            min-height: 400px;
        }
        
        .screen {
            display: none;
        }
        
        .active {
            display: block;
        }
        
        .home-screen {
            text-align: center;
        }
        
        .character {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            background: linear-gradient(135deg, #FFE66D 0%, #FF6B9D 50%, #C73E1D 100%);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            position: relative;
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.3);
            animation: starPulse 2s ease-in-out infinite;
        }

        @keyframes starPulse {
            0%, 100% { 
                transform: scale(1) rotate(0deg);
                filter: brightness(1);
            }
            50% { 
                transform: scale(1.1) rotate(5deg);
                filter: brightness(1.2);
            }
        }
        
        .game-info {
            background: linear-gradient(135deg, #E8F5E9 0%, #F1F8E9 100%);
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border: 2px dashed #81C784;
        }
        
        .game-info h3 {
            color: #52C777;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .game-info ul {
            padding-left: 20px;
        }
        
        .game-info li {
            margin-bottom: 5px;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #52C777 0%, #66BB6A 50%, #81C784 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(82, 199, 119, 0.3);
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(82, 199, 119, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #A8E6CF 0%, #98D8C8 50%, #B2E5D3 100%);
            box-shadow: 0 5px 15px rgba(168, 230, 207, 0.3);
        }
        
        .btn-secondary:hover {
            box-shadow: 0 8px 20px rgba(168, 230, 207, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #FF8A65 0%, #FF7043 50%, #FF5722 100%);
            box-shadow: 0 5px 15px rgba(255, 112, 67, 0.3);
        }
        
        .level-selection {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        
        .level-card {
            background: linear-gradient(135deg, #FFFFFF 0%, #F1F8E9 100%);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(168, 230, 207, 0.2);
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid #98D8C8;
        }
        
        .level-card:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 10px 25px rgba(168, 230, 207, 0.3);
            border-color: #52C777;
        }
        
        .level-card.active {
            border-color: #52C777;
            background: linear-gradient(135deg, #F1F8E9 0%, #E8F5E9 100%);
            box-shadow: 0 5px 15px rgba(82, 199, 119, 0.3);
        }
        
        .level-card.current-level {
            border: 3px solid #FF69B4;
            background: linear-gradient(135deg, #FFF0F5 0%, #FFE4E1 100%);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.4);
            position: relative;
        }
        
        .level-card.current-level::before {
            content: '🎯 进行中';
            position: absolute;
            top: -10px;
            right: -10px;
            background: #FF69B4;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(255, 105, 180, 0.3);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .level-card.completed {
            border-color: #66BB6A;
            background: linear-gradient(135deg, #DCEDC8 0%, #C5E1A5 100%);
            box-shadow: 0 5px 15px rgba(102, 187, 106, 0.3);
        }
        
        .level-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
            background: linear-gradient(135deg, #F0F0F0 0%, #E0E0E0 100%);
        }
        
        .level-card.locked:hover {
            transform: none;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.2);
        }
        
        .level-number {
            font-size: 24px;
            font-weight: bold;
            color: #52C777;
            margin-bottom: 10px;
        }
        
        .level-title {
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }
        
        .level-desc {
            font-size: 14px;
            color: #666;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #E8F5E9 0%, #F1F8E9 100%);
            padding: 10px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #81C784;
        }
        
        .hearts {
            display: flex;
            gap: 5px;
        }
        
        .heart {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #66BB6A 0%, #43A047 100%);
            position: relative;
            transform: rotate(-45deg);
            animation: heartbeat 1.5s ease-in-out infinite;
            box-shadow: 0 3px 8px rgba(102, 187, 106, 0.3);
        }
        
        .heart::before,
        .heart::after {
            content: '';
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #66BB6A 0%, #43A047 100%);
            border-radius: 50%;
            position: absolute;
        }
        
        .heart::before {
            top: -15px;
            left: 0;
        }
        
        .heart::after {
            left: 15px;
            top: 0;
        }
        
        .heart.lost {
            background: linear-gradient(135deg, #C5E1A5 0%, #9CCC65 100%);
            opacity: 0.5;
        }
        
        .heart.lost::before,
        .heart.lost::after {
            background: linear-gradient(135deg, #C5E1A5 0%, #9CCC65 100%);
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: rotate(-45deg) scale(1); }
            50% { transform: rotate(-45deg) scale(1.1); }
        }
        
        .crystals {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        
        .crystal {
            width: 25px;
            height: 25px;
            background: linear-gradient(135deg, #81C784 0%, #52C777 50%, #43A047 100%);
            border-radius: 50%;
            box-shadow: 0 3px 8px rgba(82, 199, 119, 0.3);
            position: relative;
            animation: crystalSparkle 2s ease-in-out infinite;
        }

        @keyframes crystalSparkle {
            0%, 100% { 
                transform: scale(1);
                filter: brightness(1);
            }
            50% { 
                transform: scale(1.1);
                filter: brightness(1.3);
            }
        }
        
        .crystal::after {
            content: '◆';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.8);
        }
        
        .question-area {
            background: linear-gradient(135deg, #FFFFFF 0%, #F1F8E9 50%, #E8F5E9 100%);
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
            text-align: center;
            box-shadow: 0 8px 20px rgba(168, 230, 207, 0.2);
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 3px solid #98D8C8;
        }
        
        .question {
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
            font-weight: bold;
        }
        
        .answer-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .answer-btn {
            background: linear-gradient(135deg, #FFFFFF 0%, #F0FFF0 100%);
            border: 2px solid #98D8C8;
            border-radius: 15px;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            color: #333;
            box-shadow: 0 3px 8px rgba(152, 216, 200, 0.2);
            font-weight: bold;
        }
        
        .answer-btn:hover {
            background: linear-gradient(135deg, #98D8C8 0%, #52C777 100%);
            color: white;
            transform: scale(1.05);
            border-color: #FF69B4;
        }
        
        .answer-btn.correct {
            background: linear-gradient(135deg, #90EE90 0%, #32CD32 100%);
            color: white;
            border-color: #32CD32;
            animation: correctPulse 0.6s ease;
            box-shadow: 0 5px 15px rgba(50, 205, 50, 0.4);
        }
        
        .answer-btn.incorrect {
            background: linear-gradient(135deg, #FFA07A 0%, #FF6347 100%);
            color: white;
            border-color: #FF6347;
            animation: incorrectShake 0.6s ease;
            box-shadow: 0 5px 15px rgba(255, 99, 71, 0.4);
        }
        
        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes incorrectShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .memory-game {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 500px;
            margin: 20px auto;
        }
        
        .memory-card {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #66BB6A 0%, #43A047 50%, #2E7D32 100%);
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
            transition: all 0.3s;
            position: relative;
            box-shadow: 0 5px 15px rgba(102, 187, 106, 0.3);
        }
        
        .memory-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(102, 187, 106, 0.4);
        }
        
        .memory-card.flipped {
            background: linear-gradient(135deg, #FFFFFF 0%, #F1F8E9 100%);
            border: 3px solid #98D8C8;
            color: #333;
            box-shadow: 0 5px 15px rgba(152, 216, 200, 0.3);
        }
        
        .memory-card.matched {
            opacity: 0.6;
            cursor: default;
            background: linear-gradient(135deg, #81C784 0%, #43A047 100%);
            box-shadow: 0 5px 15px rgba(67, 160, 71, 0.4);
            animation: matchSuccess 0.8s ease;
        }

        @keyframes matchSuccess {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        
        .memory-card.matched:hover {
            transform: none;
        }
        
        .timer {
            font-size: 18px;
            font-weight: bold;
            color: #43A047;
            margin: 10px 0;
            text-align: center;
        }
        
        .timer.warning {
            animation: warningPulse 1s ease infinite;
        }
        
        @keyframes warningPulse {
            0%, 100% { 
                color: #43A047; 
                transform: scale(1);
            }
            50% { 
                color: #66BB6A; 
                transform: scale(1.1);
            }
        }
        
        .shopping-area {
            background: linear-gradient(135deg, #F1F8E9 0%, #DCEDC8 100%);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            border: 2px solid #8BC34A;
            box-shadow: 0 5px 15px rgba(139, 195, 74, 0.2);
        }
        
        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #FFFFFF 0%, #F9FBE7 100%);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            box-shadow: 0 3px 8px rgba(139, 195, 74, 0.2);
            border: 2px solid #8BC34A;
        }
        
        .product-name {
            font-size: 16px;
            font-weight: bold;
            color: #43A047;
        }
        
        .product-price {
            font-size: 16px;
            color: #52C777;
            font-weight: bold;
        }
        
        .result-screen {
            text-align: center;
        }
        
        .result-title {
            font-size: 32px;
            margin-bottom: 20px;
            color: #43A047;
            font-weight: bold;
        }
        
        .result-stars {
            font-size: 48px;
            margin: 20px 0;
        }
        
        .result-message {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .hint-box {
            background: linear-gradient(135deg, #F1F8E9 0%, #DCEDC8 100%);
            border: 2px solid #8BC34A;
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
            box-shadow: 0 3px 8px rgba(139, 195, 74, 0.2);
        }
        
        .hint-text {
            font-size: 16px;
            color: #43A047;
            font-weight: bold;
        }
        
        .exit-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #FF8A65 0%, #FF7043 100%);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 3px 8px rgba(255, 112, 67, 0.3);
        }
        
        .exit-btn:hover {
            background: linear-gradient(135deg, #FF5722 0%, #E64A19 100%);
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 87, 34, 0.4);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            animation: modalSlideIn 0.3s ease;
        }
        
        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }
        
        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .sound-effect {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(152, 216, 200, 0.95), rgba(82, 199, 119, 0.95));
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            z-index: 1000;
            animation: soundPop 0.5s ease;
            display: none;
            box-shadow: 0 5px 15px rgba(82, 199, 119, 0.4);
        }
        
        .sound-effect.show {
            display: block;
        }
        
        .sound-effect.error {
            background: linear-gradient(135deg, rgba(255, 112, 67, 0.95), rgba(255, 87, 34, 0.95));
        }
        
        @keyframes soundPop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1 class="game-title">乘法小达人闯关赛</h1>
            <p class="game-subtitle">帮助乘法小精灵收集能量水晶，到达数学城堡！</p>
            <button class="exit-btn" onclick="exitToHome()">退出游戏</button>
        </header>
        
        <div class="game-content">
            <!-- 首页 -->
            <div id="homeScreen" class="screen active home-screen">
                <div class="character"></div>
                <div class="game-info">
                    <h3>游戏说明</h3>
                    <ul>
                        <li>学习内容：乘法计算</li>
                        <li>闯关规则：答对题目获得能量水晶</li>
                        <li>奖励机制：收集水晶获得勋章</li>
                    </ul>
                </div>

                <button class="btn" onclick="startGame()">开始游戏</button>
                <button class="btn btn-secondary" onclick="showContinueGame()">继续闯关</button>
            </div>
            
            <!-- 关卡选择 -->
            <div id="levelScreen" class="screen">
                <div class="status-bar">
                    <div class="hearts" id="heartsContainer"></div>
                    <div class="crystals" id="crystalsContainer"></div>
                </div>
                <h2 style="text-align: center; margin-bottom: 20px; color: #52C777;">选择关卡</h2>
                <div id="levelInstructions" style="text-align: center; margin-bottom: 15px; color: #666; font-size: 14px;">
                    <p>🎯 <strong>粉色边框</strong> = 当前进行中的关卡，点击继续</p>
                    <p>⭐ <strong>金色星星</strong> = 已通关的关卡，可重新挑战</p>
                </div>
                <div class="level-selection" id="levelSelection"></div>
            </div>
            
            <!-- 游戏关卡 -->
            <div id="gameScreen" class="screen">
                <div class="status-bar">
                    <div class="hearts" id="gameHeartsContainer"></div>
                    <div class="crystals" id="gameCrystalsContainer"></div>
                </div>
                <div id="levelContent"></div>
            </div>
            
            <!-- 结果页面 -->
            <div id="resultScreen" class="screen result-screen">
                <div id="resultContent"></div>
            </div>
        </div>
    </div>
    
    <!-- 模态框 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" class="modal-title"></h3>
            <p id="modalText"></p>
            <div class="modal-buttons">
                <button id="modalConfirm" class="btn"></button>
                <button id="modalCancel" class="btn btn-secondary"></button>
            </div>
        </div>
    </div>
    
    <!-- 音效提示 -->
    <div id="soundEffect" class="sound-effect"></div>
    
    <script>
        // 游戏状态
        let gameState = {
            currentLevel: 0,
            hearts: 3,
            crystals: 0,
            completedLevels: [],
            hintUsed: false,
            score: 0,
            memoryCards: [],
            flippedCards: [],
            matchedPairs: 0,
            timeLeft: 60,
            timer: null,
            currentQuestion: 0,
            questions: [],
            correctAnswers: 0
        };
        
        // 乘法口诀表
        const multiplicationTable = {
            2: Array.from({length: 10}, (_, i) => ({num: 2, times: i+1, result: 2*(i+1), chant: `二${(i+1)}得${2*(i+1)}`})),
            3: Array.from({length: 10}, (_, i) => ({num: 3, times: i+1, result: 3*(i+1), chant: `三${(i+1)}得${3*(i+1)}`})),
            4: Array.from({length: 10}, (_, i) => ({num: 4, times: i+1, result: 4*(i+1), chant: `四${(i+1)}得${4*(i+1)}`})),
            5: Array.from({length: 10}, (_, i) => ({num: 5, times: i+1, result: 5*(i+1), chant: `五${(i+1)}得${5*(i+1)}`}))
        };
        
        // 数组随机打乱函数（Fisher-Yates洗牌算法）
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // 初始化游戏
        function initGame() {
            loadGameState();
            initAudio(); // 初始化音频
            updateStatusBar();
            renderLevels();
            
            // 显示加载的进度信息
            if (gameState.completedLevels.length > 0) {
                setTimeout(() => {
                    const soundEffect = document.getElementById('soundEffect');
                    soundEffect.textContent = `欢迎回来！已通关${gameState.completedLevels.length}关，获得${gameState.crystals}颗水晶`;
                    soundEffect.className = 'sound-effect show';
                    setTimeout(() => {
                        soundEffect.className = 'sound-effect';
                    }, 3000);
                }, 1000);
            }
        }
        
        // 加载游戏状态
        function loadGameState() {
            const savedState = localStorage.getItem('multiplicationGameState');
            if (savedState) {
                const saved = JSON.parse(savedState);
                gameState = {...gameState, ...saved};
            }
        }
        
        // 保存游戏状态
        function saveGameState() {
            localStorage.setItem('multiplicationGameState', JSON.stringify(gameState));
        }
        
        // 更新状态栏
        function updateStatusBar() {
            updateHearts();
            updateCrystals();
        }
        
        // 更新爱心显示
        function updateHearts() {
            const heartsContainers = ['heartsContainer', 'gameHeartsContainer'];
            heartsContainers.forEach(id => {
                const container = document.getElementById(id);
                if (container) {
                    container.innerHTML = '';
                    for (let i = 0; i < 3; i++) {
                        const heart = document.createElement('div');
                        heart.className = `heart ${i >= gameState.hearts ? 'lost' : ''}`;
                        container.appendChild(heart);
                    }
                }
            });
        }
        
        // 更新水晶显示
        function updateCrystals() {
            const crystalsContainers = ['crystalsContainer', 'gameCrystalsContainer'];
            crystalsContainers.forEach(id => {
                const container = document.getElementById(id);
                if (container) {
                    container.innerHTML = `<span>能量水晶: </span>`;
                    for (let i = 0; i < gameState.crystals; i++) {
                        const crystal = document.createElement('div');
                        crystal.className = 'crystal';
                        container.appendChild(crystal);
                    }
                }
            });
        }
        
        // 全局音频上下文
        let audioContext = null;
        let audioEnabled = false;
        let masterVolume = 0.5; // 主音量控制（提高音量）

        // 初始化音频上下文
        function initAudio() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    // 如果音频上下文被挂起，尝试恢复
                    if (audioContext.state === 'suspended') {
                        audioContext.resume();
                    }
                    audioEnabled = true;
                    console.log('音频上下文初始化成功');
                } catch (error) {
                    console.log('音频初始化失败:', error);
                    audioEnabled = false;
                }
            }
        }



        // 播放答对音效 - Bingo! 答对了！
        function playCorrectSound() {
            if (!audioEnabled) {
                initAudio();
                if (!audioEnabled) return;
            }

            try {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                // 创建更丰富的答对音效 - 三音符上升旋律
                const notes = [
                    {freq: 523.25, duration: 0.15}, // C5
                    {freq: 659.25, duration: 0.15}, // E5  
                    {freq: 783.99, duration: 0.3}  // G5
                ];

                let startTime = audioContext.currentTime;
                notes.forEach((note, index) => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(note.freq, startTime + index * 0.1);
                    gainNode.gain.setValueAtTime(masterVolume, startTime + index * 0.1);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + index * 0.1 + note.duration);
                    oscillator.start(startTime + index * 0.1);
                    oscillator.stop(startTime + index * 0.1 + note.duration);
                });

                // 添加和弦背景
                const chordOsc = audioContext.createOscillator();
                const chordGain = audioContext.createGain();
                chordOsc.connect(chordGain);
                chordGain.connect(audioContext.destination);
                chordOsc.type = 'triangle';
                chordOsc.frequency.setValueAtTime(261.63, startTime); // C4
                chordGain.gain.setValueAtTime(masterVolume * 0.3, startTime);
                chordGain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.4);
                chordOsc.start(startTime);
                chordOsc.stop(startTime + 0.4);

                console.log('播放Bingo答对音效');
            } catch (error) {
                console.log('答对音效播放错误:', error);
            }
        }

        // 播放答错音效 - 答错了，再想想！
        function playWrongSound() {
            if (!audioEnabled) {
                initAudio();
                if (!audioEnabled) return;
            }

            try {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                const currentTime = audioContext.currentTime;
                
                // 创建更明显的错误音效 - 多层次组合
                // 1. 主音：强烈的下降音
                const mainOsc = audioContext.createOscillator();
                const mainGain = audioContext.createGain();
                mainOsc.connect(mainGain);
                mainGain.connect(audioContext.destination);
                mainOsc.type = 'sawtooth';
                mainOsc.frequency.setValueAtTime(349.23, currentTime); // F4
                mainOsc.frequency.exponentialRampToValueAtTime(174.61, currentTime + 0.15); // F3
                mainOsc.frequency.exponentialRampToValueAtTime(130.81, currentTime + 0.3); // C3
                mainGain.gain.setValueAtTime(masterVolume * 0.6, currentTime);
                mainGain.gain.exponentialRampToValueAtTime(0.01, currentTime + 0.4);
                mainOsc.start(currentTime);
                mainOsc.stop(currentTime + 0.4);

                // 2. 和声：低频震动
                const bassOsc = audioContext.createOscillator();
                const bassGain = audioContext.createGain();
                bassOsc.connect(bassGain);
                bassGain.connect(audioContext.destination);
                bassOsc.type = 'square';
                bassOsc.frequency.setValueAtTime(110, currentTime); // A2
                bassGain.gain.setValueAtTime(masterVolume * 0.3, currentTime);
                bassGain.gain.exponentialRampToValueAtTime(0.01, currentTime + 0.3);
                bassOsc.start(currentTime);
                bassOsc.stop(currentTime + 0.3);

                // 3. 高频"嘟嘟"警告音
                const beepOsc = audioContext.createOscillator();
                const beepGain = audioContext.createGain();
                beepOsc.connect(beepGain);
                beepGain.connect(audioContext.destination);
                beepOsc.type = 'square';
                beepOsc.frequency.setValueAtTime(880, currentTime); // A5
                beepGain.gain.setValueAtTime(0, currentTime);
                beepGain.gain.setValueAtTime(masterVolume * 0.2, currentTime + 0.1);
                beepGain.gain.setValueAtTime(0, currentTime + 0.12);
                beepGain.gain.setValueAtTime(masterVolume * 0.2, currentTime + 0.2);
                beepGain.gain.setValueAtTime(0, currentTime + 0.22);
                beepGain.gain.setValueAtTime(masterVolume * 0.2, currentTime + 0.3);
                beepGain.gain.setValueAtTime(0, currentTime + 0.32);
                beepOsc.start(currentTime);
                beepOsc.stop(currentTime + 0.35);

                // 4. 模糊噪音效果（增强错误感）
                const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.15, audioContext.sampleRate);
                const noiseData = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseData.length; i++) {
                    noiseData[i] = (Math.random() - 0.5) * 0.1;
                }
                
                const noiseSource = audioContext.createBufferSource();
                const noiseGain = audioContext.createGain();
                noiseSource.buffer = noiseBuffer;
                noiseSource.connect(noiseGain);
                noiseGain.connect(audioContext.destination);
                noiseGain.gain.setValueAtTime(masterVolume * 0.15, currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, currentTime + 0.15);
                noiseSource.start(currentTime);

                console.log('播放增强版答错音效');
            } catch (error) {
                console.log('答错音效播放错误:', error);
            }
        }

        // 播放通关音效 - 恭喜通关！
        function playVictorySound() {
            if (!audioEnabled) {
                initAudio();
                if (!audioEnabled) return;
            }

            try {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                // 胜利音乐 - 欢快的上升旋律
                const melody = [
                    {freq: 523.25, duration: 0.2}, // C5
                    {freq: 587.33, duration: 0.2}, // D5
                    {freq: 659.25, duration: 0.2}, // E5
                    {freq: 783.99, duration: 0.3}, // G5
                    {freq: 880.00, duration: 0.3}, // A5
                    {freq: 987.77, duration: 0.5}  // B5
                ];

                let startTime = audioContext.currentTime;
                
                // 播放主旋律
                melody.forEach((note, index) => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(note.freq, startTime + index * 0.15);
                    gainNode.gain.setValueAtTime(masterVolume * 0.4, startTime + index * 0.15);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + index * 0.15 + note.duration);
                    oscillator.start(startTime + index * 0.15);
                    oscillator.stop(startTime + index * 0.15 + note.duration);
                });

                // 添加和弦背景
                const chords = [261.63, 329.63, 392.00]; // C Major chord
                chords.forEach((freq, chordIndex) => {
                    const chordOsc = audioContext.createOscillator();
                    const chordGain = audioContext.createGain();
                    chordOsc.connect(chordGain);
                    chordGain.connect(audioContext.destination);
                    chordOsc.type = 'triangle';
                    chordOsc.frequency.setValueAtTime(freq, startTime);
                    chordGain.gain.setValueAtTime(masterVolume * 0.2, startTime);
                    chordGain.gain.exponentialRampToValueAtTime(0.01, startTime + 1.5);
                    chordOsc.start(startTime);
                    chordOsc.stop(startTime + 1.5);
                });

                // 添加装饰音
                for (let i = 0; i < 3; i++) {
                    const decorOsc = audioContext.createOscillator();
                    const decorGain = audioContext.createGain();
                    decorOsc.connect(decorGain);
                    decorGain.connect(audioContext.destination);
                    decorOsc.type = 'sine';
                    decorOsc.frequency.setValueAtTime(1046.50, startTime + 0.3 + i * 0.1); // C6
                    decorGain.gain.setValueAtTime(masterVolume * 0.1, startTime + 0.3 + i * 0.1);
                    decorGain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.35 + i * 0.1);
                    decorOsc.start(startTime + 0.3 + i * 0.1);
                    decorOsc.stop(startTime + 0.35 + i * 0.1);
                }

                console.log('播放通关胜利音效');
            } catch (error) {
                console.log('通关音效播放错误:', error);
            }
        }

        // 播放配对成功音效
        function playMatchSound() {
            if (!audioEnabled) {
                initAudio();
                if (!audioEnabled) return;
            }

            try {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.type = 'sine';
                
                const currentTime = audioContext.currentTime;
                oscillator.frequency.setValueAtTime(698.46, currentTime); // F5
                oscillator.frequency.setValueAtTime(880.00, currentTime + 0.1); // A5
                gainNode.gain.setValueAtTime(masterVolume * 0.25, currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, currentTime + 0.2);
                oscillator.start(currentTime);
                oscillator.stop(currentTime + 0.2);

                console.log('播放配对成功音效');
            } catch (error) {
                console.log('配对音效播放错误:', error);
            }
        }

        // 播放时间警告音效
        function playWarningSound() {
            if (!audioEnabled) {
                initAudio();
                if (!audioEnabled) return;
            }

            try {
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                const currentTime = audioContext.currentTime;
                
                // 创建更响亮的警告音效
                // 1. 主要警告音 - 高频嘟嘟声
                const warningOsc = audioContext.createOscillator();
                const warningGain = audioContext.createGain();
                warningOsc.connect(warningGain);
                warningGain.connect(audioContext.destination);
                warningOsc.type = 'square';
                warningOsc.frequency.setValueAtTime(1000, currentTime);
                warningGain.gain.setValueAtTime(masterVolume * 0.4, currentTime);
                warningGain.gain.setValueAtTime(0, currentTime + 0.08);
                warningGain.gain.setValueAtTime(masterVolume * 0.4, currentTime + 0.15);
                warningGain.gain.setValueAtTime(0, currentTime + 0.23);
                warningGain.gain.setValueAtTime(masterVolume * 0.4, currentTime + 0.3);
                warningGain.gain.setValueAtTime(0, currentTime + 0.38);
                warningOsc.start(currentTime);
                warningOsc.stop(currentTime + 0.4);

                // 2. 低频震动效果
                const vibrateOsc = audioContext.createOscillator();

                vibrateOsc.connect(vibrateGain);
                vibrateGain.connect(audioContext.destination);
                vibrateOsc.type = 'triangle';
                vibrateOsc.frequency.setValueAtTime(150, currentTime);
                vibrateGain.gain.setValueAtTime(masterVolume * 0.2, currentTime);
                vibrateGain.gain.exponentialRampToValueAtTime(0.01, currentTime + 0.4);
                vibrateOsc.start(currentTime);
                vibrateOsc.stop(currentTime + 0.4);

                // 3. 高频提示音
                const beepOsc = audioContext.createOscillator();
                const beepGain = audioContext.createGain();
                beepOsc.connect(beepGain);

                beepOsc.frequency.setValueAtTime(2000, currentTime);
                beepGain.gain.setValueAtTime(masterVolume * 0.1, currentTime);
                beepGain.gain.exponentialRampToValueAtTime(0.01, currentTime + 0.1);
                beepOsc.start(currentTime);
                beepOsc.stop(currentTime + 0.1);

                console.log('播放增强版时间警告音效');

                console.log('警告音效播放错误:', error);
            }
        }

        // 保留原来的playBeep函数作为备用
        function playBeep(isSuccess = true) {
            if (isSuccess) {
                playCorrectSound();
            } else {
                playWrongSound();
            }
        }
        
        // 显示音效
        function showSoundEffect(text, isError = false) {
            // 根据文本内容播放对应的特殊音效
            if (text.includes('Bingo') || text.includes('答对了')) {
                playCorrectSound();
            } else if (text.includes('答错了') || text.includes('再想想')) {
                playWrongSound();
            } else if (text.includes('恭喜通关') || text.includes('全部通关')) {
                playVictorySound();
            } else if (text.includes('配对成功')) {
                playMatchSound();
            } else if (text.includes('时间快到啦') || text.includes('警告')) {
                playWarningSound();
            } else {
                // 使用默认音效
                playBeep(!isError);
            }
            
            // 显示文字提示
            const soundEffect = document.getElementById('soundEffect');
            soundEffect.textContent = text;
            soundEffect.className = `sound-effect show ${isError ? 'error' : ''}`;
            setTimeout(() => {
                soundEffect.className = 'sound-effect';
            }, 1500);
        }
        
        // 开始游戏
        function startGame() {
            // 确保音频已激活
            initAudio();
            
            gameState = {
                currentLevel: 1,
                hearts: 3,
                crystals: 0,
                completedLevels: [],
                hintUsed: false,
                score: 0,
                memoryCards: [],
                flippedCards: [],
                matchedPairs: 0,
                timeLeft: 60,
                timer: null,
                currentQuestion: 0,
                questions: [],
                correctAnswers: 0
            };
            saveGameState();
            showScreen('levelScreen');
            updateStatusBar();
            renderLevels();
        }
        
        // 继续游戏
        function showContinueGame() {
            // 重新加载最新的保存状态
            loadGameState();
            
            if (gameState.completedLevels.length > 0) {
                // 显示详细的进度信息
                const progressText = `已通关${gameState.completedLevels.length}个关卡，获得${gameState.crystals}颗水晶`;
                showNotification('继续游戏', progressText);
                
                setTimeout(() => {
                    showScreen('levelScreen');
                    updateStatusBar();
                    renderLevels();
                }, 1500);
            } else {
                showNotification('暂无存档', '还没有游戏进度，请先开始新游戏！');
            }
        }
        
        // 渲染关卡选择
        function renderLevels() {
            const levelSelection = document.getElementById('levelSelection');
            levelSelection.innerHTML = '';
            
            const levels = [
                {id: 1, title: '2的口诀小启蒙', desc: '完成5道基础题', crystals: 1},
                {id: 2, title: '3的口诀大挑战', desc: '背诵+应用题', crystals: 2},
                {id: 3, title: '4的口诀配对赛', desc: '60秒卡片配对', crystals: 2},
                {id: 4, title: '5的口诀情境闯', desc: '超市购物应用', crystals: 3},
                {id: 5, title: '口诀混合大通关', desc: '综合测试', crystals: 5}
            ];
            
            // 计算已解锁的关卡（已通关的关卡和下一个未通关的关卡）
            const maxUnlockedLevel = Math.max(
                ...gameState.completedLevels,
                // 如果没有任何通关记录，至少解锁第一关
                gameState.completedLevels.length === 0 ? 1 : Math.max(...gameState.completedLevels) + 1,
                // 如果有当前进行中的关卡，也要解锁
                gameState.currentLevel || 0
            );
            
            levels.forEach(level => {
                const card = document.createElement('div');
                card.className = 'level-card';
                
                if (gameState.completedLevels.includes(level.id)) {
                    card.className += ' completed';
                } else if (level.id > maxUnlockedLevel) {
                    card.className += ' locked';
                } else {
                    card.className += ' active';
                    
                    // 如果是当前正在进行的关卡，添加特殊标识
                    if (level.id === gameState.currentLevel) {
                        card.className += ' current-level';
                    }
                }
                
                // 为已通关的关卡添加星级显示
                let starsDisplay = '';
                if (gameState.completedLevels.includes(level.id)) {
                    starsDisplay = '<div style="color: #FFD700; font-size: 18px; margin-top: 5px;">⭐⭐⭐</div>';
                }
                
                // 为当前关卡添加进度显示
                let progressDisplay = '';
                if (level.id === gameState.currentLevel && gameState.currentQuestion > 0) {
                    progressDisplay = `<div style="color: #666; font-size: 12px; margin-top: 5px;">进度: ${gameState.currentQuestion}/${gameState.questions.length}题</div>`;
                }
                
                card.innerHTML = `
                    <div class="level-number">关卡 ${level.id}</div>
                    <div class="level-title">${level.title}</div>
                    <div class="level-desc">${level.desc}</div>
                    <div style="margin-top: 10px;">
                        <span style="color: #52C777;">◆ ${level.crystals} 水晶</span>
                    </div>
                    ${starsDisplay}
                    ${progressDisplay}
                `;
                
                // 已通关和已解锁的关卡都可以点击
                if (!card.className.includes('locked')) {
                    card.onclick = () => startLevel(level.id);
                    
                    // 为已通关关卡添加鼠标提示
                    if (gameState.completedLevels.includes(level.id)) {
                        card.title = '点击重新挑战此关卡';
                    } else if (level.id === gameState.currentLevel) {
                        card.title = '继续当前关卡';
                    } else {
                        card.title = '开始此关卡';
                    }
                } else {
                    card.title = '需要先完成前面的关卡';
                }
                
                levelSelection.appendChild(card);
            });
        }
        
        // 开始关卡
        function startLevel(levelId) {
            const previousLevel = gameState.currentLevel;
            
            // 如果是切换到不同的关卡，重置进度
            if (previousLevel !== levelId) {
                gameState.currentLevel = levelId;
                gameState.hintUsed = false;
                gameState.currentQuestion = 0;
                gameState.correctAnswers = 0;
                gameState.questions = [];
                gameState.hearts = 3; // 重置爱心
            } else {
                // 继续当前关卡，保持进度
                gameState.currentLevel = levelId;
            }
            
            showScreen('gameScreen');
            updateStatusBar();
            
            // 保存关卡选择状态
            saveGameState();
            
            switch(levelId) {
                case 1:
                    startLevel1();
                    break;
                case 2:
                    startLevel2();
                    break;
                case 3:
                    startLevel3();
                    break;
                case 4:
                    startLevel4();
                    break;
                case 5:
                    startLevel5();
                    break;
            }
        }
        
        // 关卡1：2的口诀小启蒙
        function startLevel1() {
            // 如果已有题目列表且当前进度不为0，则继续之前的题目
            if (gameState.questions.length > 0 && gameState.currentQuestion > 0) {
                showQuestion();
                return;
            }
            
            const allQuestions = [
                {type: 'multiplication', question: '2×3=？', answer: '6', options: ['4', '5', '6', '7']},
                {type: 'multiplication', question: '5×2=？', answer: '10', options: ['8', '9', '10', '11']},
                {type: 'multiplication', question: '2×7=？', answer: '14', options: ['12', '13', '14', '15']},
                {type: 'multiplication', question: '4×2=？', answer: '8', options: ['6', '7', '8', '9']},
                {type: 'multiplication', question: '2×2=？', answer: '4', options: ['2', '3', '4', '5']},
                {type: 'multiplication', question: '6×2=？', answer: '12', options: ['10', '11', '12', '13']},
                {type: 'multiplication', question: '2×9=？', answer: '18', options: ['16', '17', '18', '19']},
                {type: 'multiplication', question: '8×2=？', answer: '16', options: ['14', '15', '16', '17']},
                {type: 'multiplication', question: '2×5=？', answer: '10', options: ['8', '9', '10', '11']},
                {type: 'multiplication', question: '3×2=？', answer: '6', options: ['4', '5', '6', '7']},
                {type: 'multiplication', question: '2×8=？', answer: '16', options: ['14', '15', '16', '17']},
                {type: 'multiplication', question: '7×2=？', answer: '14', options: ['12', '13', '14', '15']}
            ];
            // 从题库中随机抽取8道题
            gameState.questions = shuffleArray(allQuestions).slice(0, 8);
            showQuestion();
        }
        
        // 关卡2：3的口诀大挑战
        function startLevel2() {
            // 如果已有题目列表且当前进度不为0，则继续之前的题目
            if (gameState.questions.length > 0 && gameState.currentQuestion > 0) {
                showQuestion();
                return;

        // 初始化记忆游戏
        function initMemoryGame() {
            const allProblems = [
                {equation: '4×2', result: '8'},
                {equation: '3×3', result: '9'},
                {equation: '4×4', result: '16'},
                {equation: '3×5', result: '15'},

                {equation: '2×6', result: '12'},
                {equation: '4×5', result: '20'},
                {equation: '3×6', result: '18'},
                {equation: '4×1', result: '4'},
                {equation: '3×4', result: '12'}
            ];
            // 随机抽取6道题进行配对
            const problems = shuffleArray(allProblems).slice(0, 6);
            
            const cards = [];
            problems.forEach((problem, index) => {
                cards.push({id: index * 2, content: problem.equation, type: 'equation', pair: index, equation: problem.equation, result: problem.result});
                cards.push({id: index * 2 + 1, content: problem.result, type: 'result', pair: index, equation: problem.equation, result: problem.result});
            });
            
            // 打乱卡片
            cards.sort(() => Math.random() - 0.5);
            gameState.memoryCards = cards;
            
            const memoryGame = document.getElementById('memoryGame');
            memoryGame.innerHTML = '';
            
            cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'memory-card';
                cardElement.textContent = '?';
                cardElement.dataset.cardId = card.id;
                cardElement.dataset.cardIndex = index;
                cardElement.onclick = () => flipCard(card.id);
                memoryGame.appendChild(cardElement);
            });
        }
        
        // 翻转卡片
        function flipCard(cardId) {
            if (gameState.flippedCards.length >= 2) return;
            
            const cardIndex = gameState.memoryCards.findIndex(c => c.id === cardId);
            const cardElement = document.querySelectorAll('.memory-card')[cardIndex];
            const card = gameState.memoryCards[cardIndex];
            
            if (!cardElement || cardElement.classList.contains('flipped') || cardElement.classList.contains('matched')) {
                return;
            }
            
            cardElement.classList.add('flipped');
            cardElement.textContent = card.content;
            gameState.flippedCards.push(cardId);
            
            if (gameState.flippedCards.length === 2) {
                checkMemoryMatch();
            }
        }
        
        // 检查记忆匹配
        function checkMemoryMatch() {
            const [id1, id2] = gameState.flippedCards;
            const cardIndex1 = gameState.memoryCards.findIndex(c => c.id === id1);
            const cardIndex2 = gameState.memoryCards.findIndex(c => c.id === id2);
            const card1 = gameState.memoryCards[cardIndex1];
            const card2 = gameState.memoryCards[cardIndex2];
            
            const cardElements = document.querySelectorAll('.memory-card');
            const element1 = cardElements[cardIndex1];
            const element2 = cardElements[cardIndex2];
            
            // 检查是否为配对（相同pair且不同type）
            if (card1.pair === card2.pair && card1.type !== card2.type) {
                // 配对成功
                setTimeout(() => {
                    element1.classList.add('matched');
                    element2.classList.add('matched');
                    gameState.matchedPairs++;
                    gameState.flippedCards = [];
                    
                    showSoundEffect('配对成功！');
                    
                    // 保存配对进度
                    saveGameState();
                    
                    // 检查是否完成所有配对
                    if (gameState.matchedPairs >= 6) {
                        clearInterval(gameState.timer);
                        setTimeout(() => levelSuccess(), 1000);
                    }
                }, 500);
            } else {
                // 配对失败
                setTimeout(() => {
                    element1.classList.remove('flipped');
                    element2.classList.remove('flipped');
                    element1.textContent = '?';
                    element2.textContent = '?';
                    gameState.flippedCards = [];
                }, 1000);
            }
        }

                        }
                    }
                }
                
                if (gameState.timeLeft <= 0) {

                    levelFailed();
                }
            }, 1000);
        }

        // 生成答题选项
        function generateAnswerOptions(question) {
            if (!question.options) {
                // 为没有预设选项的题目生成选项
                const correctAnswer = parseInt(question.answer);
                const options = [question.answer];
                
                // 生成3个错误选项（更智能的错误答案生成）
                while (options.length < 4) {
                    let wrongAnswer;
                    const strategy = Math.floor(Math.random() * 3);
                    
                    switch(strategy) {
                        case 0: // 加减1-3
                            wrongAnswer = correctAnswer + Math.floor(Math.random() * 7) - 3;
                            break;
                        case 1: // 相邻乘法结果
                            const factor = Math.floor(Math.random() * 2) + 2;
                            wrongAnswer = correctAnswer - factor + Math.floor(Math.random() * 2 * factor);
                            break;
                        case 2: // 十位数误差
                            wrongAnswer = correctAnswer + (Math.random() > 0.5 ? 10 : -10);
                            break;
                    }
                    
                    if (wrongAnswer > 0 && !options.includes(wrongAnswer.toString())) {
                        options.push(wrongAnswer.toString());
                    }
                }
                
                // 使用Fisher-Yates洗牌算法随机排列选项
                question.options = shuffleArray(options);
            } else {
                // 对已有选项也进行随机排列
                question.options = shuffleArray(question.options);
            }
            
            return question.options.map((option, index) => 
                `<button class="answer-btn" onclick="checkAnswer('${option}')">${option}</button>`
            ).join('');
        }

        // 生成提示
        function generateHint(question) {
            if (question.type === 'multiplication' || question.type === 'mixed') {
                // 提取乘法部分
                const match = question.match(/(\d+)×(\d+)/);
                if (match) {
                    const [, num1, num2] = match;
                    return `提示：试试用${num1}的乘法口诀，${num2}个${num1}相加`;
                }
            } else if (question.type === 'chant') {
                return '提示：想想3的乘法口诀表';
            } else if (question.type === 'shopping') {
                return '提示：用乘法计算总数，记得单价×数量';
            }
            return '提示：仔细读题，想想乘法的含义';
        }
        
        // 生成题目
        function generateQuestions(number, count) {
            const questions = [];
            const table = multiplicationTable[number];
            
            for (let i = 0; i < count; i++) {
                const item = table[Math.floor(Math.random() * table.length)];
                questions.push({
                    type: 'multiplication',
                    question: `${item.num}×${item.times}=？`,
                    answer: item.result.toString(),
                    options: null
                });
            }
            
            return questions;
        }

            // 显示提示信息
            const soundEffect = document.getElementById('soundEffect');
            soundEffect.textContent = '游戏进度已保存！水晶和关卡进度已保留';
            soundEffect.className = 'sound-effect show';
            setTimeout(() => {
                soundEffect.className = 'sound-effect';
            }, 2000);
            
            // 延迟返回首页，让用户看到保存提示
            setTimeout(() => {
                // 不清除currentLevel，保持关卡信息
                showScreen('homeScreen');
            }, 500);
        }

        // 显示退出确认（保留原来的确认对话框作为备用）
        function showExitModal() {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalText = document.getElementById('modalText');
            const modalConfirm = document.getElementById('modalConfirm');
            const modalCancel = document.getElementById('modalCancel');
            
            modalTitle.textContent = '退出游戏';
            modalText.textContent = '确定要退出吗？当前进度会保存哦';
            modalConfirm.textContent = '确定退出';
            modalCancel.textContent = '继续游戏';
            
            modalConfirm.onclick = () => {
                saveGameState();
                closeModal();
                // 清除当前游戏状态，返回首页
                gameState.currentLevel = 0;
                showScreen('homeScreen');
                showNotification('已返回首页', '游戏进度已保存！');
            };
            
            modalCancel.onclick = closeModal;
            
            modal.classList.add('active');
        }
        
        // 显示通知
        function showNotification(title, message) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalText = document.getElementById('modalText');
            const modalConfirm = document.getElementById('modalConfirm');
            const modalCancel = document.getElementById('modalCancel');
            
            modalTitle.textContent = title;
            modalText.textContent = message;
            modalConfirm.textContent = '确定';
            modalCancel.style.display = 'none';
            
            modalConfirm.onclick = closeModal;
            
            modal.classList.add('active');
        }
        
        // 关闭模态框
        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            document.getElementById('modalCancel').style.display = 'inline-block';
        }
        
        // 初始化游戏
        window.onload = function() {
            initGame();
        };
        
        // 页面关闭时自动保存游戏进度
        window.addEventListener('beforeunload', function(e) {
            // 如果有游戏进度，保存状态
            if (gameState.currentLevel > 0 || gameState.completedLevels.length > 0) {
                saveGameState();
                console.log('游戏进度已自动保存');
            }
        });
        
        // 页面隐藏时也保存（比如切换标签页）
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && (gameState.currentLevel > 0 || gameState.completedLevels.length > 0)) {
                saveGameState();
                console.log('页面隐藏，游戏进度已保存');
            }
        });
    </script>
</body>
</html>
